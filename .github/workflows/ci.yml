name: CI

# Chạy khi push lên nhánh phụ (mọi nhánh trừ main) và khi mở/cập nhật PR vào main.
on:
  push:
    branches-ignore:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      # Engine Python (services/subtitle-engine) là mã chạy thật của Auto Subtitle
      # nhưng nằm ngoài toolchain Node nên trước đây CI không đụng tới: sửa engine
      # làm hỏng test vẫn xanh. Engine không cần DB/Redis/ffmpeg để chạy test.
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pytest
        run: python -m pip install --disable-pip-version-check pytest

      - name: Subtitle engine tests (Python)
        run: npm run test:subtitle-engine


  # App con độc lập trong thư mục sellertool/ (Vite + React, package.json riêng).
  sellertool:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sellertool
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: sellertool/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm run test

      - name: Build
        run: npm run build
