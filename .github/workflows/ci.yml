name: CI

# Chạy khi push lên nhánh phụ (mọi nhánh trừ main) và khi mở/cập nhật PR vào main.
on:
  push:
    branches-ignore:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      # Lint CHƯA đưa vào CI: `next lint` chưa được cấu hình ESLint trong repo
      # (chạy `next lint` sẽ hỏi cấu hình tương tác). Xem README mục "Lint".
