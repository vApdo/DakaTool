<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kệ giấy 3D</title>
<style>
  :root { --bg:#eceae6; --panel:#ffffffe6; --ink:#222; --muted:#666; --line:#d4d1cb; --accent:#c0392b; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#1d1d1f; --panel:#2a2a2de6; --ink:#eee; --muted:#aaa; --line:#444; }
  }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--ink);
    font:14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; overflow:hidden; }
  #c { display:block; width:100vw; height:100vh; touch-action:none; cursor:grab; }
  #c:active { cursor:grabbing; }
  .panel { position:fixed; left:16px; top:16px; background:var(--panel); border:1px solid var(--line);
    border-radius:10px; padding:12px 14px; max-width:260px; backdrop-filter:blur(6px); }
  .panel h1 { font-size:15px; margin:0 0 4px; }
  .panel p { margin:0 0 10px; color:var(--muted); font-size:12px; }
  .row { margin:8px 0; }
  .row b { display:block; font-size:12px; margin-bottom:4px; color:var(--muted); font-weight:600; }
  .sw { display:inline-block; width:24px; height:24px; border-radius:50%; border:2px solid var(--line);
    margin-right:6px; cursor:pointer; vertical-align:middle; }
  .sw.on { border-color:var(--accent); box-shadow:0 0 0 2px var(--accent) inset; }
  button { font:inherit; font-size:12px; padding:5px 9px; margin:2px 4px 2px 0; border-radius:6px;
    border:1px solid var(--line); background:transparent; color:var(--ink); cursor:pointer; }
  button.on { background:var(--accent); border-color:var(--accent); color:#fff; }
  .hint { position:fixed; bottom:12px; left:0; right:0; text-align:center; color:var(--muted); font-size:12px; pointer-events:none; }
  @media (max-width:520px){ .panel{ max-width:none; right:16px; padding:10px; } .panel p{display:none} }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="panel">
  <h1>Kệ giấy vệ sinh, khung sắt 20×20</h1>
  <p>Tổng thể 280 × 150 × 240 mm. Đúng kích thước theo bản vẽ 2D.</p>
  <div class="row"><b>Màu khung sắt</b>
    <span class="sw on" data-steel="#5a5d61" style="background:#5a5d61" title="Xám titan"></span>
    <span class="sw" data-steel="#1e1e1e" style="background:#1e1e1e" title="Đen nhám"></span>
    <span class="sw" data-steel="#e8e6e1" style="background:#e8e6e1" title="Trắng"></span>
  </div>
  <div class="row"><b>Màu sơn mặt gỗ</b>
    <span class="sw on" data-wood="#8a5a3b" style="background:#8a5a3b" title="Nâu gỗ"></span>
    <span class="sw" data-wood="#f2efe9" style="background:#f2efe9" title="Trắng kem"></span>
    <span class="sw" data-wood="#2b2b2b" style="background:#2b2b2b" title="Đen"></span>
    <span class="sw" data-wood="#7d8b74" style="background:#7d8b74" title="Xanh rêu"></span>
  </div>
  <div class="row">
    <button id="bPaper" class="on">Cuộn giấy</button>
    <button id="bWood" class="on">Mặt gỗ</button>
    <button id="bExplode">Tách rời</button>
    <button id="bReset">Góc nhìn gốc</button>
  </div>
</div>
<div class="hint">Kéo để xoay · Cuộn / chụm 2 ngón để phóng to · Chuột phải / 2 ngón kéo để dời</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({canvas, antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputEncoding = THREE.sRGBEncoding;

const scene = new THREE.Scene();
const dark = matchMedia('(prefers-color-scheme: dark)').matches;
scene.background = new THREE.Color(dark ? 0x1d1d1f : 0xeceae6);
const camera = new THREE.PerspectiveCamera(35, 1, 1, 5000);

scene.add(new THREE.HemisphereLight(0xffffff, 0x8a8178, 0.65));
const sun = new THREE.DirectionalLight(0xffffff, 0.75);
sun.position.set(420, 600, 520);
sun.castShadow = true;
sun.shadow.mapSize.set(2048,2048);
Object.assign(sun.shadow.camera, {left:-300,right:300,top:300,bottom:-300,near:10,far:2000});
sun.shadow.bias = -0.0008;
sun.target.position.set(130,100,0);
scene.add(sun, sun.target);
const fill = new THREE.DirectionalLight(0xffffff, 0.25);
fill.position.set(-400,200,300); scene.add(fill);

// ---- Materials ----
const steelMat = new THREE.MeshStandardMaterial({color:0x5a5d61, metalness:0.55, roughness:0.38});
const woodMat  = new THREE.MeshStandardMaterial({color:0x8a5a3b, metalness:0.0, roughness:0.45});
const capMat   = new THREE.MeshStandardMaterial({color:0x111111, roughness:0.7});
const paperMat = new THREE.MeshStandardMaterial({color:0xfbfaf6, roughness:0.95});
const coreMat  = new THREE.MeshStandardMaterial({color:0xb08a5e, roughness:0.9, side:THREE.DoubleSide});
const screwMat = new THREE.MeshStandardMaterial({color:0xbfbfbf, metalness:0.8, roughness:0.3});

// Wall with tile grid texture
function tileTexture(){
  const cv=document.createElement('canvas'); cv.width=cv.height=512;
  const g=cv.getContext('2d');
  g.fillStyle='#d9d6d0'; g.fillRect(0,0,512,512);
  for(let i=0;i<4000;i++){ g.fillStyle=`rgba(0,0,0,${Math.random()*0.03})`; g.fillRect(Math.random()*512,Math.random()*512,2,2); }
  g.strokeStyle='#c4c0b9'; g.lineWidth=4;
  g.strokeRect(0,0,512,512);
  const t=new THREE.CanvasTexture(cv); t.wrapS=t.wrapT=THREE.RepeatWrapping; t.repeat.set(2.4,2.4);
  t.encoding=THREE.sRGBEncoding; return t;
}
const wall = new THREE.Mesh(new THREE.PlaneGeometry(1440,1440), new THREE.MeshStandardMaterial({map:tileTexture(), roughness:0.6}));
wall.position.set(130,100,-3); wall.receiveShadow = true; scene.add(wall);

// ---- Helpers: box tube 20x20 (solid box is fine visually) with end caps ----
const parts = []; // {mesh, base:Vector3, dir:Vector3}
function box(sx,sy,sz, x,y,z, mat, explodeDir){
  const m = new THREE.Mesh(new THREE.BoxGeometry(sx,sy,sz), mat);
  m.position.set(x,y,z); m.castShadow = m.receiveShadow = true;
  scene.add(m);
  parts.push({mesh:m, base:m.position.clone(), dir:(explodeDir||new THREE.Vector3()).clone()});
  return m;
}
const V = (x,y,z)=>new THREE.Vector3(x,y,z);

// Frame (khay) y = 180..200
box(260,20,20, 130,190,10,  steelMat, V(0,0,-1)).name='thanh sau';
box(260,20,20, 130,190,140, steelMat, V(0,0,1)).name='thanh truoc';
box(20,20,110, 10,190,75,   steelMat, V(-1,0,0));
box(20,20,110, 250,190,75,  steelMat, V(1,0,0));
// Post (trụ) x 240..260, y 0..180, z 0..20
box(20,180,20, 250,90,10,   steelMat, V(1,-0.6,-0.4));
// Stub (tay ngang) z 20..85
box(20,20,65,  250,100,52.5,steelMat, V(1.4,-0.3,0.3));
// Rod (trục) x 110..240, slight 2.5° upward tilt toward free end
const rod = box(130,20,20, 175,100,75, steelMat, V(-0.4,-0.6,0.9));
rod.rotation.z = -THREE.MathUtils.degToRad(2.5);
const cap = box(6,22,22, 107,100+65*Math.sin(THREE.MathUtils.degToRad(2.5))+0,75, capMat, V(-1.2,-0.6,0.9));
// Mounting tabs (bản mã) 20x40x3 behind frame
[[50,170],[210,170],[250,-5]].forEach(([x,y],i)=>{
  box(20,40,3, x,y,-1.5, steelMat, V(0,i===2?-1:-0.3,-0.4));
  const s = new THREE.Mesh(new THREE.CylinderGeometry(5,5,3,20), screwMat);
  s.rotation.x = Math.PI/2;
  const sy = i===2 ? -12 : 165;
  s.position.set(x, sy, 1.5); scene.add(s);
  parts.push({mesh:s, base:s.position.clone(), dir:V(0,i===2?-1:-0.3,-0.4)});
});

// Wood top 280 x 15 x 150, y 200..215
const wood = box(280,15,150, 130,207.5,75, woodMat, V(0,2.2,0));
// wood screws heads (visible from below) – small
[[10,10],[250,10],[10,140],[250,140],[130,10],[130,140]].forEach(([x,z])=>{
  const s=new THREE.Mesh(new THREE.CylinderGeometry(3.5,3.5,1.5,16), screwMat);
  s.position.set(x,179.2,z); scene.add(s);
  parts.push({mesh:s, base:s.position.clone(), dir:V(0,-0.5,0)});
});

// ---- Paper roll D120 x 100, core D44 ----
const roll = new THREE.Group();
const outer = new THREE.Mesh(new THREE.CylinderGeometry(60,60,100,64,1,true), paperMat);
const ringGeo = new THREE.RingGeometry(22,60,64);
const endA = new THREE.Mesh(ringGeo, paperMat); endA.position.y = 50; endA.rotation.x = -Math.PI/2;
const endB = new THREE.Mesh(ringGeo, paperMat); endB.position.y = -50; endB.rotation.x = Math.PI/2;
const core = new THREE.Mesh(new THREE.CylinderGeometry(22,22,100.5,48,1,true), coreMat);
const coreRim = new THREE.Mesh(new THREE.RingGeometry(20,22,48), coreMat);
coreRim.position.y=50.3; coreRim.rotation.x=-Math.PI/2;
const coreRim2 = coreRim.clone(); coreRim2.position.y=-50.3; coreRim2.rotation.x=Math.PI/2;
[outer,endA,endB,core,coreRim,coreRim2].forEach(m=>{m.castShadow=true; m.receiveShadow=true; roll.add(m);});
// hanging sheet from front-bottom
const sheet = new THREE.Mesh(new THREE.PlaneGeometry(100,90), paperMat.clone());
sheet.material.side = THREE.DoubleSide;
sheet.rotation.z = Math.PI/2; // plane XY in roll local -> after group rotation becomes vertical
roll.rotation.z = Math.PI/2;  // axis along X
roll.position.set(175,100,75);
scene.add(roll);
const sheetMesh = new THREE.Mesh(new THREE.PlaneGeometry(100,85), new THREE.MeshStandardMaterial({color:0xfbfaf6, roughness:0.95, side:THREE.DoubleSide}));
sheetMesh.position.set(175, 100-42.5, 75+60);
sheetMesh.castShadow = true;
scene.add(sheetMesh);
parts.push({mesh:roll, base:roll.position.clone(), dir:V(-2.2,-0.4,1.2)});
parts.push({mesh:sheetMesh, base:sheetMesh.position.clone(), dir:V(-2.2,-0.4,1.2)});

// ---- Orbit controls (minimal) ----
const target = V(150,105,60);
const defaults = {theta: 0.62, phi: 1.22, r: 720};
let {theta, phi, r} = defaults;
let tgt = target.clone();
function place(){
  camera.position.set(
    tgt.x + r*Math.sin(phi)*Math.sin(theta),
    tgt.y + r*Math.cos(phi),
    tgt.z + r*Math.sin(phi)*Math.cos(theta));
  camera.lookAt(tgt);
}
const pointers = new Map(); let lastDist=0, mode=null, last={x:0,y:0};
canvas.addEventListener('contextmenu', e=>e.preventDefault());
canvas.addEventListener('pointerdown', e=>{
  canvas.setPointerCapture(e.pointerId);
  pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
  mode = (e.button===2 || e.shiftKey) ? 'pan' : 'rot';
  if (pointers.size===2){ mode='pinch'; const [a,b]=[...pointers.values()]; lastDist=Math.hypot(a.x-b.x,a.y-b.y); last={x:(a.x+b.x)/2,y:(a.y+b.y)/2}; }
  else last={x:e.clientX,y:e.clientY};
});
canvas.addEventListener('pointermove', e=>{
  if(!pointers.has(e.pointerId)) return;
  pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if (mode==='pinch' && pointers.size===2){
    const [a,b]=[...pointers.values()];
    const d=Math.hypot(a.x-b.x,a.y-b.y); r=Math.min(2000,Math.max(250, r*lastDist/d)); lastDist=d;
    const m={x:(a.x+b.x)/2,y:(a.y+b.y)/2}; pan(m.x-last.x,m.y-last.y); last=m; return;
  }
  const dx=e.clientX-last.x, dy=e.clientY-last.y; last={x:e.clientX,y:e.clientY};
  if(mode==='pan') pan(dx,dy);
  else { theta -= dx*0.008; phi = Math.min(Math.PI-0.05, Math.max(0.05, phi - dy*0.008)); }
});
function pan(dx,dy){
  const s = r*0.0016;
  const right = V().setFromMatrixColumn(camera.matrix,0), up = V().setFromMatrixColumn(camera.matrix,1);
  tgt.addScaledVector(right,-dx*s).addScaledVector(up,dy*s);
}
['pointerup','pointercancel'].forEach(t=>canvas.addEventListener(t,e=>{pointers.delete(e.pointerId); if(pointers.size===0) mode=null; else if(pointers.size===1){mode='rot'; last=[...pointers.values()][0];}}));
canvas.addEventListener('wheel', e=>{ e.preventDefault(); r=Math.min(2000,Math.max(250, r*Math.exp(e.deltaY*0.001))); }, {passive:false});

// ---- UI ----
function swatches(attr, mat){
  document.querySelectorAll(`[data-${attr}]`).forEach(el=>el.addEventListener('click',()=>{
    document.querySelectorAll(`[data-${attr}]`).forEach(x=>x.classList.remove('on'));
    el.classList.add('on'); mat.color.set(el.dataset[attr]);
    if(attr==='steel') mat.metalness = el.dataset.steel==='#1e1e1e' ? 0.25 : 0.55;
    if(attr==='steel') mat.roughness = el.dataset.steel==='#1e1e1e' ? 0.75 : 0.38;
  }));
}
swatches('steel', steelMat); swatches('wood', woodMat);
const toggle=(id,fn)=>{const b=document.getElementById(id); b.addEventListener('click',()=>{b.classList.toggle('on'); fn(b.classList.contains('on'));});};
toggle('bPaper', on=>{ roll.visible=on; sheetMesh.visible=on; });
toggle('bWood', on=>{ wood.visible=on; });
let explodeT=0, explodeGoal=0;
toggle('bExplode', on=>{ explodeGoal = on?1:0; });
document.getElementById('bReset').addEventListener('click',()=>{ ({theta,phi,r}=defaults); tgt.copy(target); });

function resize(){
  const w=innerWidth,h=innerHeight; renderer.setSize(w,h,false);
  camera.aspect=w/h; camera.updateProjectionMatrix();
  if (w<520 && r===defaults.r) r = 950;
}
addEventListener('resize',resize); resize();

(function loop(){
  explodeT += (explodeGoal-explodeT)*0.12;
  parts.forEach(p=>p.mesh.position.copy(p.base).addScaledVector(p.dir, explodeT*45));
  place(); renderer.render(scene,camera); requestAnimationFrame(loop);
})();
})();
</script>
</body>
</html>
