# Hạ tầng phụ trợ cho Auto Subtitle khi phát triển cục bộ: PostgreSQL + Redis.
# Next.js app và worker chạy trên máy host (npm run dev / npm run worker:subtitle).
services:
  postgres:
    image: postgres:16
    container_name: dakatool-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: dakatool
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d dakatool"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    container_name: dakatool-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
